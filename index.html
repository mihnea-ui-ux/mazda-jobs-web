<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://gist.githubusercontent.com https://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<title>MAZDA Jobs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<svg class="sprite" width="0" height="0" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="4.5" width="18" height="4" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2"/><rect x="3" y="15.5" width="18" height="4" rx="2"/></g></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke-linecap="round"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.5h4l.4-2.5c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></g></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="navbar" id="navbar">
  <span class="nav-title" id="navTitle" hidden>Acasă</span>
  <div class="modsw" id="modsw" role="tablist" aria-label="Modul">
    <button role="tab" data-mod="career" aria-selected="true">Carieră</button>
    <button role="tab" data-mod="design" aria-selected="false">Design</button>
  </div>
  <button class="nav-btn" id="addBtn" aria-label="Aplicare nouă"><svg><use href="#i-plus"/></svg></button>
</header>

<main id="main">
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="large"><p class="eyebrow" id="today"></p><h1>Acasă</h1></div>
    <div class="glass hero">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring" aria-hidden="true"><circle cx="60" cy="60" r="50" class="ring-bg"/><circle cx="60" cy="60" r="50" class="ring-fg" id="ringFg"/></svg>
        <div class="ring-txt"><b id="respRate">0%</b><span>rată răspuns</span></div>
      </div>
      <div class="hero-stats">
        <div><b id="stTotal">0</b><span>Total</span></div>
        <div><b id="stActive">0</b><span>Active</span></div>
        <div><b id="stInterview">0</b><span>Interviuri</span></div>
        <div><b id="stOffer">0</b><span>Oferte</span></div>
      </div>
    </div>
    <div class="glass card" id="scanCard" hidden>
      <div class="card-h"><h2>Scanarea MAZDA</h2><span class="sub" id="scanSub"></span></div>
      <div id="scanBody" class="list-plain"></div>
    </div>
    <div class="glass card">
      <div class="card-h"><h2>Pipeline</h2><span class="sub" id="pipeSub"></span></div>
      <div class="funnel" id="funnel"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="glass card">
      <div class="card-h"><h2>Următorii pași</h2><button class="txtbtn" data-goto="agenda">Toate</button></div>
      <div id="homeNext" class="list-plain"></div>
    </div>
    <div class="glass card">
      <div class="card-h"><h2>Activitate recentă</h2></div>
      <div id="recent" class="list-plain"></div>
    </div>
  </section>

  <!-- LIST -->
  <section class="view" id="v-list" hidden>
    <div class="large"><p class="eyebrow" id="listCount"></p><h1>Aplicări</h1></div>
    <label class="searchbar glass-lite"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="Caută companie sau rol" autocomplete="off"></label>
    <div class="segments" id="segments" role="tablist"></div>
    <div class="glass group" id="appList"></div>
  </section>

  <!-- AGENDA -->
  <section class="view" id="v-agenda" hidden>
    <div class="large"><p class="eyebrow">Pași următori și termene</p><h1>Agendă</h1></div>
    <div id="agendaList"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-settings" hidden>
    <div class="large"><p class="eyebrow">MAZDA Jobs</p><h1>Setări</h1></div>
    <p class="group-h">Sincronizare</p>
    <div class="glass group">
      <button class="cell" id="syncBtn"><span>Telefon și Mac</span><small id="syncState">Oprită</small><svg class="chev"><use href="#i-chev"/></svg></button>
    </div>
    <p class="group-h">Date</p>
    <div class="glass group">
      <button class="cell" id="feedBtn"><span>Verifică scanarea MAZDA</span><small id="feedState">se verifică la fiecare deschidere</small><svg class="chev"><use href="#i-chev"/></svg></button>
      <button class="cell" id="seedBtn"><span>Importă țintele MAZDA</span><small>9 bănci, în Carieră, ca „De aplicat”</small><svg class="chev"><use href="#i-chev"/></svg></button>
      <button class="cell" id="exportBtn"><span>Exportă backup</span><small>Copiază datele (JSON)</small><svg class="chev"><use href="#i-chev"/></svg></button>
      <button class="cell" id="importBtn"><span>Importă backup</span><small>Lipește datele (JSON)</small><svg class="chev"><use href="#i-chev"/></svg></button>
    </div>
    <p class="group-h">Notificări</p>
    <div class="glass group">
      <button class="cell" id="notifBtn"><span>Remindere pentru pașii următori</span><small id="notifState">La ora 9:00 în ziua pasului</small><svg class="chev"><use href="#i-chev"/></svg></button>
    </div>
    <p class="group-h">Zonă periculoasă</p>
    <div class="glass group">
      <button class="cell danger" id="wipeBtn"><span>Șterge toate datele</span><small>Apasă de două ori</small></button>
    </div>
    <p class="foot"><span id="footTxt">Datele rămân doar pe acest dispozitiv.</span><br>v2.1</p>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="home"><svg><use href="#i-home"/></svg><span>Acasă</span></button>
  <button class="tab" data-tab="list"><svg><use href="#i-list"/></svg><span>Aplicări</span></button>
  <button class="tab" data-tab="agenda"><svg><use href="#i-cal"/></svg><span>Agendă</span></button>
  <button class="tab" data-tab="settings"><svg><use href="#i-gear"/></svg><span>Setări</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grabber" id="grabber"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
